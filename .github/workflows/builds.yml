# Builds the Rock Band Blitz installer from a tag and publishes it.
#
# The release model is one product and one file per release (installer/README.md,
# section "The one product"): the complete package built from the tagged commit, whose
# one asset is the setup executable itself - no manifest, no payload archive, no
# checksum file to keep in step with it. A release is cut by pushing a tag that matches
# [installer] version in installer\config\pins.toml; for an installer that is not a
# release, run installer\build.ps1 on the machine that has the game data.
#
# Everything runs on a self-hosted Windows runner, and that is a fact about the
# project rather than a preference: building the game needs `game/default.xex` and the
# payload needs the user's own game data, neither of which is in the repository (by
# design - docs/guides/distributable.md). A hosted runner has no game data, so it
# cannot build this. Register this checkout's machine as a runner with the labels
# below, and keep the game data where the build expects it.
#
# Nothing in this file is needed to play the game, and nothing in it runs on a
# developer's machine unless they push a tag.

name: builds

on:
  push:
    tags: ['*']

permissions:
  contents: write

concurrency:
  # One build per tag at a time.
  group: builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: the complete package, and the release it goes on
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out this repository with its submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: The game data has to be here
        run: |
          # The build reads the user's own copy of the game (or a backed-up one) and
          # refuses to guess. Failing here says so in one line instead of failing
          # somewhere inside the toolchain with a fingerprint mismatch.
          if (-not (Test-Path 'game\default.xex')) {
            throw ("game\default.xex is missing on this runner. The recompiled build is derived " +
                   "from the user's own game data, which is deliberately not in the repository: " +
                   "docs/guides/build-and-run.md has what the working tree needs.")
          }
          Write-Host "game data: ok"

      - name: The SDK submodule's links and patches
        run: |
          pwsh -File scripts\repair_flat_symlinks.ps1
          pwsh -File scripts\apply_sdk_patches.ps1

      - name: Build the game and Controller Settings
        run: |
          cmake --preset win-amd64-release
          cmake --build --preset win-amd64-release

      - name: Which product this is
        id: product
        run: |
          $version = (Select-String -Path installer\config\pins.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' |
                      Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $version) { throw 'installer\config\pins.toml names no [installer] version' }
          # A tag that does not match the pinned version would publish a release
          # whose file name says one version and whose installer says another.
          # Refused.
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($tag -ne $version) {
            throw ("the tag ($tag) and the pinned version ($version) disagree: bump " +
                   "[installer] version in installer\config\pins.toml, or tag $version")
          }
          "name=RockBandBlitzSetup-$version" >> $env:GITHUB_OUTPUT
          "title=Rock Band Blitz $version" >> $env:GITHUB_OUTPUT
          Write-Host "product: tag ${{ github.ref_name }} -> RockBandBlitzSetup-$version.exe"

      - name: Build the installer
        run: |
          # The tagged commit is the commit the release records: -PayloadCommit is
          # passed explicitly so the install manifest names it.
          pwsh -ExecutionPolicy Bypass -NoProfile -File installer\build.ps1 -PayloadCommit '${{ github.sha }}'

      - name: Publish the one file
        run: |
          $asset = "installer\out\dist\${{ steps.product.outputs.name }}.exe"
          if (-not (Test-Path $asset)) { throw "$asset was not built" }
          $sha = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = @(
            "Rock Band Blitz, recompiled from the user's own game data.",
            "",
            "Download the setup executable and run it: it carries everything it installs, and",
            "it needs no network access.",
            "",
            "sha256: $sha",
            "",
            "Built from commit ${{ github.sha }}."
          ) -join "`n"

          gh release create '${{ github.ref_name }}' $asset `
            --title '${{ steps.product.outputs.title }}' --notes $notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


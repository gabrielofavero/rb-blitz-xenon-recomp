# Release pins for the Rock Band Blitz installer.
#
# This file is the single source of truth for everything the installer needs to
# know about the outside world. tools/embed_config.cpp compiles it (plus the two
# fingerprint files) into generated/embedded_config.h for the native helper and
# generated/pins.iss for the Inno Setup wizard, so the wizard and the helper can
# never disagree about what they are installing.
#
# Keep this file content-free: identifiers, versions, URLs, sizes and hashes
# only. See ../README.md and ../../docs/backlog.md for the
# distribution rules the release has to satisfy.

schema_version = 1

[installer]
# `name` titles the wizard and names the entry in Add/Remove Programs; the
# uninstall entry itself shows `short_name`, so the program the user sees there
# is "Rock Band Blitz" and not "Rock Band Blitz Xenon Recomp version 0.1.0".
name = "Rock Band Blitz Xenon Recomp"
short_name = "Rock Band Blitz"
version = "0.1.0"
publisher = "Gabriel Fávero"
homepage_url = "https://github.com/gabrielofavero/rb-blitz-xenon-recomp"
support_url = "https://github.com/gabrielofavero/rb-blitz-xenon-recomp/issues"
# Folder offered under {localappdata}\Programs and appended to the install
# directory the user picks.
default_dir_name = "Rock Band Blitz"
# Lowest Windows version the runtime needs: the recompiled binary and the
# runtime DLLs are x86-64-v2, so nothing older than Windows 10 will do.
min_windows_build = "10.0.17763"

[payload]
# The recompiled game the installer places. Either embedded in the setup
# executable at build time (tools/make_payload.ps1 + build.ps1, the default) or
# downloaded from `url` at install time; `build.ps1 -PayloadUrl/-PayloadSha256`
# override the values below for a release without editing this file.
#
# Left empty in the repository: a pin that does not exist yet is worse than a
# clear "no payload source configured" message. The release workflow (README.md,
# section "Cutting a release") fills it in.
version = ""
url = ""
sha256 = ""
size = 0
# Commit of the recompiled build this setup ships, recorded in the install
# manifest and in the installation report - recorded, never verified, the way
# `version` above is. build.ps1 resolves it before the pins are compiled in:
# "latest" is the newest commit of the checkout being built, and any other value
# is a ref or a commit id git has to resolve to one, so neither half of the
# installer ever sees a ref. A build that does not go through build.ps1 has
# nothing to resolve it and refuses a pin that is not a 40-character commit id
# (write one here, or pass -PayloadCommit <id>); empty means "record nothing".
commit = "latest"

[update]
# How a launcher finds out that a newer release exists, and how it installs it
# (docs/plans/launcher-plan.md D19, installer/README.md section "Updating").
#
# `manifest_url` is where the launcher looks on every start. tools/embed_config.cpp
# compiles it into the launcher and also generates the file it points at
# (out/generated/update.toml, published as the release asset `update.toml`), so the
# version a launcher compares itself against is this file's installer version and
# never a second copy of it. The URL names the *latest* release's asset on purpose:
# GitHub redirects it, so a launcher built today keeps finding tomorrow's release
# without being rebuilt.
manifest_url = "https://github.com/gabrielofavero/rb-blitz-xenon-recomp/releases/latest/download/update.toml"
# The folder, under the user's own local application data, that holds the updater
# the setup executable puts on disk (RockBandBlitzUpdater.exe). It is deliberately
# not the install folder: the launcher's folder carries the game and its payload, and
# a second copy of an installer in it would be one more file to explain (and one more
# file the payload audit has to allow). The launcher resolves the same folder, so the
# two have to agree: see kUpdateDirName in launcher/src/update_launcher.cpp.
dir_name = "rb_blitz"
# Whether this release changes what the game reads out of the user's own game
# files. `false` - the usual case, where a release only moves the recompiled
# code around - installs the payload and keeps the game data that is already
# there, going straight to the progress bar. `true` asks for the package or the
# folder again, because this release's payload needs the data re-derived from it.
# It describes the delta from the release before it, so it is written by whoever
# cuts the release, and it travels in update.toml.
requires_game_data = false

[ultimate]
# Rock Band Blitz Ultimate, a fan mod maintained at the repository below. Its
# files are downloaded on demand from the upstream release - never mirrored,
# re-hosted or bundled - and only when the user asks for them.
#
# Schema-compatibility pin: the runtime in this repository looks for
# ultimate/gen/patch_xbox.hdr and ultimate/gen/patch_xbox_0.ark under the game
# data root (see ../../src/hooks/ultimate.cpp and ../../docs/ultimate-compat.md).
# This is the release those two files are known to come from; the fingerprint
# file next to this one records what they hash to.
version = "2.11"
url = "https://github.com/ultimate-mods-rb/blitz-ultimate/releases/download/2.11/Rock-Band-Blitz-Ultimate-2.11-Xbox.zip"
sha256 = "6524a193de32de2961cd95329b65cdeda8dec9d813cbdf9bbd8dd3646ca8d5ff"
size = 10366787
repository_url = "https://github.com/ultimate-mods-rb/blitz-ultimate"
release_url = "https://github.com/ultimate-mods-rb/blitz-ultimate/releases/tag/2.11"
# Subtree of the release archive that belongs in <game root>\ultimate, and the
# console the runtime emulates. The archive also carries a default.xex; it is
# deliberately not installed, because the runtime reproduces that delta itself
# from the user's own default.xex (docs/ultimate-compat.md).
archive_prefix = "Xbox"
destination_dir = "ultimate"

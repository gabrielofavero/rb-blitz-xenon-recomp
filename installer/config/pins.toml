# Release pins for the Rock Band Blitz installer.
#
# This file is the single source of truth for everything the installer needs to
# know about the outside world. tools/embed_config.cpp compiles it (plus the two
# fingerprint files) into generated/embedded_config.h for the native helper and
# generated/pins.iss for the Inno Setup wizard, so the wizard and the helper can
# never disagree about what they are installing.
#
# Keep this file content-free: identifiers, versions, URLs, sizes and hashes
# only. See ../README.md and ../../docs/README.md for the
# distribution rules the release has to satisfy.

schema_version = 1

[installer]
# `name` titles the wizard and is what its own sentences call the program (`[name]`
# expands to it); `short_name` is what Add/Remove Programs lists. Both are "Rock Band
# Blitz": what the user installs is the game, and the release page is where the name
# of the recompilation is written. Until 2026-10-14 `name` was "Rock Band Blitz Xenon
# Recomp", which put the project's name in the wizard's title bar and in "Setup will
# install ... into the following folder".
name = "Rock Band Blitz"
short_name = "Rock Band Blitz"
# The version of the installer and of the build inside it. Change this and run
# installer\build.ps1 again: the setup executable is named after it
# (RockBandBlitzSetup-<version>.exe), the wizard is titled with it and every
# install manifest records it.
version = "0.1.0"
publisher = "Gabriel Fávero"
homepage_url = "https://github.com/gabrielofavero/rb-blitz-xenon-recomp"
support_url = "https://github.com/gabrielofavero/rb-blitz-xenon-recomp/issues"
# Folder offered under {localappdata}\Programs and appended to the install
# directory the user picks.
default_dir_name = "Rock Band Blitz"
# Lowest Windows version the runtime needs: the recompiled binary and the
# runtime DLLs are x86-64-v2, so nothing older than Windows 10 will do.
min_windows_build = "10.0.17763"

[payload]
# The recompiled game is embedded from this workspace's release build by
# tools/make_payload.ps1 and build.ps1. These empty download fields are retained
# for compatibility with the helper's existing config schema.
#
# Left empty in the repository: a pin that does not exist yet is worse than a
# clear "no payload source configured" message.
version = ""
url = ""
sha256 = ""
size = 0
# Kept empty for compatibility with existing install manifests. Builds use the
# workspace contents and the [installer] version; no commit is pinned or recorded.
commit = ""

[update]
# Legacy helper schema and cleanup location for installations made by old
# setup executables. Current releases have no auto updater or update manifest.
manifest_url = ""
dir_name = "rb_blitz"
requires_game_data = false
[ultimate]
# Rock Band Blitz Ultimate, a fan mod maintained at the repository below. Its
# files are downloaded on demand from the upstream release - never mirrored,
# re-hosted or bundled - and only when the user asks for them.
#
# Schema-compatibility pin: the runtime in this repository looks for
# ultimate/gen/patch_xbox.hdr and ultimate/gen/patch_xbox_0.ark under the game
# data root (see ../../src/hooks/ultimate.cpp and ../../docs/guides/ultimate-compat.md).
# This is the release those two files are known to come from; the fingerprint
# file next to this one records what they hash to.
version = "2.11"
url = "https://github.com/ultimate-mods-rb/blitz-ultimate/releases/download/2.11/Rock-Band-Blitz-Ultimate-2.11-Xbox.zip"
sha256 = "6524a193de32de2961cd95329b65cdeda8dec9d813cbdf9bbd8dd3646ca8d5ff"
size = 10366787
repository_url = "https://github.com/ultimate-mods-rb/blitz-ultimate"
release_url = "https://github.com/ultimate-mods-rb/blitz-ultimate/releases/tag/2.11"
# Subtree of the release archive that belongs in <game root>\ultimate, and the
# console the runtime emulates. The archive also carries a default.xex; it is
# deliberately not installed, because the runtime reproduces that delta itself
# from the user's own default.xex (docs/guides/ultimate-compat.md).
archive_prefix = "Xbox"
destination_dir = "ultimate"

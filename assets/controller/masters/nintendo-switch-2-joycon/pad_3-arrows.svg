<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Switch 2 Joy-Con pad 3 callout routes</title>
  <desc>Xbox-position text rails and button callouts on the paired Joy-Con silhouette.</desc>
  <image id="pad-reference" href="pad.png" x="100" y="195" width="824" height="660" preserveAspectRatio="none" opacity="0.65"/>
  <g id="routes" fill="none" stroke="#00aed6" stroke-width="13" stroke-linejoin="round">
    <polyline id="left_shoulder_pair" points="160,264 200,284"/>
    <polyline id="left_stick" points="130,759 130,438 210,408"/>
    <polyline id="dpad" points="130,759 130,575 224,575"/>
    <polyline id="x_button" points="936,441 936,275 735,275 735,371"/>
    <polyline id="b_button" points="900,613 900,391 836,391"/>
    <polyline id="a_button" points="912,758 842,650 842,431 798,431"/>
  </g>
  <g id="text-rails" fill="none" stroke="#00aed6" stroke-width="13">
    <line id="top-left" x1="16" y1="264" x2="160" y2="264"/>
    <line id="bottom-left" x1="16" y1="759" x2="130" y2="759"/>
    <line id="top-right" x1="936" y1="441" x2="1006" y2="441"/>
    <line id="middle-right" x1="900" y1="613" x2="1009" y2="613"/>
    <line id="bottom-right" x1="912" y1="758" x2="1008" y2="758"/>
  </g>
</svg>

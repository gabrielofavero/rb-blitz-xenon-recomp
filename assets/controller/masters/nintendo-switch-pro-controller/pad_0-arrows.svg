<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Switch Pro pad 0 callout routes</title>
  <desc>Text rails follow the Xbox 360 pad labels. Shoulder callouts use the visible top and side edges of the Switch Pro silhouette.</desc>
  <image id="pad-reference" href="pad.png" x="100" y="211" width="824" height="604" preserveAspectRatio="none" opacity="0.65"/>
  <g id="routes" fill="none" stroke="#00aed6" stroke-width="14" stroke-linejoin="round">
    <polyline id="left_shoulder_pair" points="170,265 260,300"/>
    <polyline id="right_shoulder_pair" points="854,265 764,300"/>
    <polyline id="left_stick" points="86,760 315,458"/>
    <polyline id="dpad" points="289,760 402,551"/>
    <polyline id="right_stick" points="698,758 607,557"/>
    <polyline id="a_button" points="913,758 800,650 740,560 703,490"/>
    <polyline id="x_button" points="900,660 800,540 800,480 675,415"/>
  </g>
  <g id="text-rails" fill="none" stroke="#00aed6" stroke-width="14">
    <line id="top-left" x1="16" y1="265" x2="170" y2="265"/>
    <line id="top-right" x1="854" y1="265" x2="1009" y2="265"/>
    <line id="bottom-left" x1="16" y1="760" x2="289" y2="760"/>
    <line id="bottom-right" x1="698" y1="758" x2="1009" y2="758"/>
    <line id="middle-right" x1="900" y1="660" x2="1009" y2="660"/>
  </g>
</svg>

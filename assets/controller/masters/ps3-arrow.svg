      <stop offset="0" stop-color="#9cdfef"/>
      <stop offset="0.14" stop-color="#9cdfef"/>
      <stop offset="0.29" stop-color="#44c3e3"/>
      <stop offset="0.43" stop-color="#18b6de"/>
      <stop offset="0.5" stop-color="#00aed6"/>
      <stop offset="0.71" stop-color="#18b6de"/>
      <stop offset="0.86" stop-color="#9cdfef"/>

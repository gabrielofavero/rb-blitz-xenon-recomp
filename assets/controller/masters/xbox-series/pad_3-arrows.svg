<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Xbox Series pad 3 callout routes</title>
  <desc>Text rail placement follows template-360/pads/pad_3.png. Arrow tips follow Xbox Series control edges.</desc>
  <image id="pad-reference" href="pad.png" x="100" y="245" width="824" height="553"
         preserveAspectRatio="none" opacity="0.65"/>
  <g id="routes" fill="none" stroke="#00aed6" stroke-width="13" stroke-linejoin="round">
    <polyline id="left_trigger" points="245,264 309,303"/>
    <polyline id="left_bumper" points="168,264 303,343"/>
    <polyline id="left_stick" points="86,759 294,528"/>
    <polyline id="dpad" points="288,759 399,637"/>
    <polyline id="x_button" points="750,441 730,400 670,400 638,472"/>
    <polyline id="b_button" points="878,613 778,500"/>
    <polyline id="a_button" points="912,758 720,556"/>
  </g>
  <g id="text-rails" fill="none" stroke="#00aed6" stroke-width="13">
    <line id="top-left" x1="16" y1="264" x2="245" y2="264"/>
    <line id="bottom-left" x1="16" y1="759" x2="288" y2="759"/>
    <line id="top-right" x1="750" y1="441" x2="1006" y2="441"/>
    <line id="middle-right" x1="878" y1="613" x2="1009" y2="613"/>
    <line id="bottom-right" x1="912" y1="758" x2="1008" y2="758"/>
  </g>
</svg>

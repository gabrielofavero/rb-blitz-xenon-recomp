<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Xbox Series pad 2 callout routes</title>
  <desc>Text rail placement follows template-360/pads/pad_2.png. Arrow tips follow Xbox Series control edges.</desc>
  <image id="pad-reference" href="pad.png" x="100" y="245" width="824" height="553"
         preserveAspectRatio="none" opacity="0.65"/>
  <g id="routes" fill="none" stroke="#00aed6" stroke-width="14" stroke-linejoin="round">
    <polyline id="left_trigger" points="246,265 309,303"/>
    <polyline id="right_trigger" points="776,265 719,303"/>
    <polyline id="left_bumper" points="175,507 303,343"/>
    <polyline id="right_bumper" points="837,507 746,344"/>
    <polyline id="x_button" points="867,660 708,486 678,486"/>
  </g>
  <g id="text-rails" fill="none" stroke="#00aed6" stroke-width="14">
    <line id="top-left" x1="16" y1="265" x2="246" y2="265"/>
    <line id="top-right" x1="776" y1="265" x2="1009" y2="265"/>
    <line id="middle-left" x1="4" y1="507" x2="175" y2="507"/>
    <line id="middle-right" x1="837" y1="507" x2="1005" y2="507"/>
    <line id="lower-right" x1="867" y1="660" x2="1009" y2="660"/>
  </g>
</svg>

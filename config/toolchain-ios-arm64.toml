# iOS arm64 experimental bootstrap record, not device acceptance evidence.
# Freeze measured versions and Xcode/SDK deployment inputs on a Mac before release.
schema_version = 1
target = "ios-arm64"
compiler_family = "AppleClang"

[sdk]
commit = "a3e1d82678ca20d68d4837a8e9ee4652ff073745"

[clang]
# The SDK requires AppleClang >= 17 or LLVM Clang >= 20.
version = "17.0.0"
minimum = "17"

[cmake]
version = "3.25.0"
minimum = "3.25"

[ninja]
version = "1.11.0"

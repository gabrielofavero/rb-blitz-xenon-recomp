# Forced function entry points - three left, all absolute tail-branch targets.
#
# The discovery pass leaves three absolute tail-branch targets (unconditional
# `b` to an address outside any discovered function) unresolved. Each target
# is a real function entry that discovery never reached because nothing calls
# it with a `bl`/`ba` that discovery follows.
#
# Entries here force codegen to register the address as a function entry point
# (FunctionAuthority::CONFIG). No `size`/`end` is given on purpose: codegen
# then discovers natural boundaries from the code region, matching the
# behavior used for PDATA-discovered functions.
#
# Evidence (from codegen validation, run 1):
#   b 0x82354DC0  from  0x8234017C
#   b 0x82379D20  from  0x82364A10
#   b 0x8243C688  from  0x8242A8DC
#
# Resolution (verified 2026-09-09, codegen trace):
#   sub_82354DC0  (3 insns)  tail-calls sub_82354D00
#   sub_82379D20  (1 insn)   tail-calls sub_82380088
#   sub_8243C688  (10 insns) tail-calls sub_8243C458
#
# These three are now the whole list. The 21 indirect-call targets that used to be
# forced here (5 at boot, 0x8278A6E0, 0x827EC038, 14 adjuster-thunk slots) went away
# on 2026-09-29: patch 0005's gap fill now registers the runs inside a code region that
# no function's extent claims, and it then finds every one of the 21, with
# 0x827EC038 - the last one, a 24-byte comparator whose address exists nowhere in the
# image - among them (docs/known-issues.md B-006, docs/history/bringup-log.md,
# "B-006: the last forced entry goes away").
#
# These three cannot all go the same way, measured. With this file emptied to a comment,
# two of them (`0x82354DC0`, `0x82379D20`) are found by the same rule - the word in front
# of each is an unconditional branch, which leaves control - and only `0x8243C688` is
# left, so the Validate phase fails with
#   UnresolvedCall (1): 0x8243C688 from 0x8242A8DC: b 0x8243C688 from 0x8242A8DC -
#   target not in any function
# The instruction in front of that one is a `bl`, and a call falls through: what follows
# it is the caller's next instruction, not an entry. Nothing else in the image mentions
# the address, so the tail branch is its only reference and the entry stays here. Both of
# the other two could be dropped today; they stay because an entry costs nothing and this
# class is one decision rather than two.


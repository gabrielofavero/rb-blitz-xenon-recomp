# Forced function entry points.
#
# The discovery pass leaves three absolute tail-branch targets (unconditional
# `b` to an address outside any discovered function) unresolved. Each target
# is a real function entry that discovery never reached because nothing calls
# it with a `bl`/`ba` that discovery follows.
#

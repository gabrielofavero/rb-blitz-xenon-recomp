# Manual codegen overrides. Two groups:
#
#  1. Forced entry points - addresses discovery cannot reach through a
#     `bl`/`ba`, so codegen has to be told they are function entries.
#  2. Names for functions already proved by hand - a readability lever only.
#     The name must resolve to the same body; no `size`/`end` is given, so
#     codegen redisovers the natural boundary exactly as it does for a PDATA
#     entry, and the generated body is unchanged.
#
# The naming rule, the evidence and the confidence for every name below are in
# docs/reference/symbols.md "Named symbols".

# ---------------------------------------------------------------------------
# Forced entry points - three left, all absolute tail-branch targets.
# ---------------------------------------------------------------------------
#
# The discovery pass leaves three absolute tail-branch targets (unconditional
# `b` to an address outside any discovered function) unresolved. Each target
# is a real function entry that discovery never reached because nothing calls
# it with a `bl`/`ba` that discovery follows.
#
# Entries here force codegen to register the address as a function entry point
# (FunctionAuthority::CONFIG). No `size`/`end` is given on purpose: codegen
# then discovers natural boundaries from the code region, matching the
# behavior used for PDATA-discovered functions.
#
# Evidence (from codegen validation, run 1):
#   b 0x82354DC0  from  0x8234017C
#   b 0x82379D20  from  0x82364A10
#   b 0x8243C688  from  0x8242A8DC
#
# Resolution (verified 2026-09-09, codegen trace):
#   sub_82354DC0  (3 insns)  tail-calls sub_82354D00
#   sub_82379D20  (1 insn)   tail-calls sub_82380088
#   sub_8243C688  (10 insns) tail-calls sub_8243C458
#
# These three are now the whole list. The 21 indirect-call targets that used to be
# forced here (5 at boot, 0x8278A6E0, 0x827EC038, 14 adjuster-thunk slots) went away
# on 2026-09-29: patch 0005's gap fill now registers the runs inside a code region that
# no function's extent claims, and it then finds every one of the 21, with
# 0x827EC038 - the last one, a 24-byte comparator whose address exists nowhere in the
# image - among them (docs/reference/known-issues.md B-006, docs/history/bringup-log.md,
# "B-006: the last forced entry goes away").
#
# These three cannot all go the same way, measured. With this file emptied to a comment,
# two of them (`0x82354DC0`, `0x82379D20`) are found by the same rule - the word in front
# of each is an unconditional branch, which leaves control - and only `0x8243C688` is
# left, so the Validate phase fails with
#   UnresolvedCall (1): 0x8243C688 from 0x8242A8DC: b 0x8243C688 from 0x8242A8DC -
#   target not in any function
# The instruction in front of that one is a `bl`, and a call falls through: what follows
# it is the caller's next instruction, not an entry. Nothing else in the image mentions
# the address, so the tail branch is its only reference and the entry stays here. Both of
# the other two could be dropped today; they stay because an entry costs nothing and this
# class is one decision rather than two.

# All three are pure tail thunks: their whole body is argument setup plus one
# unconditional branch, so they are named `Thunk_<target>` - see the naming rule.

[functions."0x82354DC0"]
name = "Thunk_82354D00"
# Tail-branch target from 0x8234017C; thunk -> sub_82354D00.

[functions."0x82379D20"]
name = "Thunk_82380088"
# Tail-branch target from 0x82364A10; thunk -> sub_82380088.

[functions."0x8243C688"]
name = "Thunk_8243C458"
# Tail-branch target from 0x8242A8DC; thunk -> sub_8243C458.

# ---------------------------------------------------------------------------
# Named functions - the MOGG (music) decryption path, all PDATA entry points.
# ---------------------------------------------------------------------------
#
# Proved by hand from the recompiled image, the run log and the engine sources
# (docs/reference/symbols.md "Audio (MOGG) decryption path",
# docs/history/bringup-log.md B-009 and its follow-up). Every address below is
# already a function; the entry exists only to attach the name, so the body is
# the one codegen already generated.

[functions."0x823DE070"]
name = "ByteGrinder_GetEncMethod"
# MOGG version -> key-table index selector.

[functions."0x823DE0C0"]
name = "ByteGrinder_HvDecrypt"
# Installs the version's key, then AES-128-ECB-decrypts the 16-byte header mask.

[functions."0x82768AD0"]
name = "VorbisReader_SetupCypher"
# Stream key = GrindArray(keychain) ^ mKeyMask, then CTR start.

[functions."0x82768C88"]
name = "VorbisReader_CheckHmxHeader"
# MOGG header parser; the only caller of ByteGrinder_HvDecrypt.

[functions."0x82727218"]
name = "XeKeys_SetKey"
# Guest wrapper over the __imp__XeKeysSetKey import (+0xE0 id bias).

[functions."0x827272B0"]
name = "XeKeys_AesCbc"
# Guest wrapper over the __imp__XeKeysAesCbc import (+0xE0 id bias).

# The engine computes its width and render targets from this height. Apply the
# boot resolution before that computation, never after the buffers are created.
[[midasm_hook]]
address = 0x823F382C
name = "RenderHeightHook"
registers = ["r11"]
after_instruction = true

# The very next thing the function does is derive the width from that height: `divw r7,height*16,9`
# (0x823F3870, or `*4/3` at 0x823F385C for a 4:3 display) and store it at +64 (0x823F3878). This
# hook runs *before* that store with both copies of the width - r7 for the field, r29 for the
# two-rect table the function builds right after - so a width that is not 16:9 of the height is
# possible, which is the whole of ultrawide support. See src/hooks/render_settings.cpp.
[[midasm_hook]]
address = 0x823F3878
name = "RenderFrameWidthHook"
registers = ["r7", "r29"]

# The audio read hook uses its caller's r31 to identify the VorbisReader.
# Synchronize localized nonvolatiles across this call.
[functions."0x827E08F8"]
share_registers = true

# Cleanup funclets and the stack probe take their parent frame or size in r12.
# Keep these nonstandard call boundaries in shared context under localization.
[functions]
"0x82256D2C" = { share_registers = true }
"0x82256D74" = { share_registers = true }

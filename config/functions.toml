# Proved by hand from the recompiled image, the run log and the engine sources
# (docs/symbols.md "Audio (MOGG) decryption path",
# docs/history/bringup-log.md B-009 and its follow-up). Every address below is
# already a function; the entry exists only to attach the name, so the body is
# the one codegen already generated.


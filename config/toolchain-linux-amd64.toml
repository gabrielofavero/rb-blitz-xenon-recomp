# Linux x86-64 bootstrap record for Prompt 0. Versions below are required
# starting points, not accepted release-toolchain measurements. Replace them
# with versions measured on the native release builder before strict release.
schema_version = 1
target = "linux-amd64"
compiler_family = "Clang"

[sdk]
commit = "c94f5ebdcb3c9d1a460ca48e04f9758448f8d518"

[clang]
# The Linux preset calls clang++-20; the SDK requires LLVM Clang >= 18.
version = "20.0.0"
minimum = "18"

[cmake]
version = "3.25.0"
minimum = "3.25"

[ninja]
version = "1.11.0"

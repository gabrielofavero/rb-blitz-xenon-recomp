# Linux x86-64 bootstrap record. Versions below are required
# starting points, not accepted release-toolchain measurements. Replace them
# with versions measured on the native release builder before strict release.
schema_version = 1
target = "linux-amd64"
compiler_family = "Clang"

[sdk]
commit = "a3e1d82678ca20d68d4837a8e9ee4652ff073745"

[clang]
# The Linux preset calls clang++-20; the SDK requires LLVM Clang >= 20.
version = "20.0.0"
minimum = "20"

[cmake]
version = "3.25.0"
minimum = "3.25"

[ninja]
version = "1.11.0"

# The supported build toolchain, frozen the way the supported game dump is
# (config/game_fingerprints.toml): the record lives in the repository instead of
# in one machine's build tree, and something checks it. That something is
# tools/toolchain_check.cpp, built as rb_blitz_toolchain and run by the build
# before codegen, so a build states the toolchain it is about to use instead of
# leaving it in the build tree's CMakeCache.txt. docs/guides/toolchain.md is the prose
# half of this file.
#
# What is compared:
#   * `commit` - an exact revision (the ReXGlue SDK pin). A difference is fatal.
#   * `version` - dotted numbers. `minimum` is the oldest still accepted and
#     failing it is fatal; any other difference is reported and, unless the build
#     asked for a strict toolchain, still builds.
# A `path` key is still understood - it is informational and never compared -
# but none is recorded here. Where a tool lives is a property of the machine a
# build runs on, not of this project, and a committed path would be one
# developer's disk leaking into every other checkout. The check prints the
# location it actually used, which is the machine you are on.
#
# Unknown sections and keys are ignored, so this file can grow ahead of the tool.
#
# Values are double-quoted with C escapes or single-quoted literals. Nothing here
# needs the single-quoted form today; it stays available for a value that
# legitimately holds backslashes.

schema_version = 1

[sdk]
# The pinned ReXGlue SDK submodule. The gitlink in the parent commit already
# refuses a different commit at clone time; this copy is what puts the pin in the
# same report as the compiler and the rest. `version` is what the SDK reports for
# itself and depends on whether its tags were fetched, so it is informational.
version = "0.10.0.0-dev.unknown"
commit = "c94f5ebdcb3c9d1a460ca48e04f9758448f8d518"

[clang]
# `minimum` is the floor the code needs, not the version the recorded run was
# made with: the pinned SDK's own CMakeLists refuses anything below Clang 18
# ("ReXGlue requires Clang 18 or newer"), so any Clang the SDK accepts builds
# this project. `version` is what the acceptance run behind this record used;
# anything newer is reported as `different` and still builds.
version = "23.1.1"
minimum = "18"

[cmake]
# The floor is the project's own `cmake_minimum_required`.
version = "4.4.3"
minimum = "3.25"

[ninja]
version = "1.13.2"

[msvc]
# The MSVC toolchain clang takes its headers and libraries from. `version` here is
# the toolset directory under VC\Tools\MSVC (not the Visual Studio product
# version, which docs/guides/toolchain.md records separately). This is not cosmetic -
# without those headers the build fails on <windows.h> rather than on anything the
# presets name.
version = "14.44.35207"

[windows_sdk]
version = "10.0.26100.0"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rock Band Blitz portrait layouts</title>
<style>
:root { color-scheme: dark; --card:#171721; --border:#505060; background:#101017; color:#f6f6fa; }
body { margin:0; }
#blitz-portrait button:disabled { opacity:.45; }
</style>
</head>
<body>
<div id="blitz-portrait" class="viz-dotted-background">
  <label class="bp-picker">Screen <select aria-label="Portrait screen"></select></label>
  <div class="bp-phone"><div class="bp-island" aria-hidden="true"></div><div class="bp-screen"></div><div class="bp-home" aria-hidden="true"></div></div>
  <div class="bp-nav"><button type="button" data-step="-1">‹ Previous</button><output aria-live="polite"></output><button type="button" data-step="1">Next ›</button></div>
</div>
<style>
#blitz-portrait {display:grid;justify-items:center;gap:10px;padding:12px;font:14px system-ui}
#blitz-portrait .bp-picker,#blitz-portrait .bp-nav {display:flex;align-items:center;justify-content:space-between;gap:10px;width:min(100%,350px)}
#blitz-portrait select,#blitz-portrait .bp-nav button {font:inherit;color:inherit;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:7px 9px;min-height:40px}
#blitz-portrait select {max-width:85%;flex:1}
#blitz-portrait .bp-phone {width:min(100%,350px);aspect-ratio:402/874;container-type:inline-size;position:relative;overflow:hidden;background:#090812;color:#fff;box-shadow:0 0 0 2px #555;font-family:Arial,sans-serif}
#blitz-portrait .bp-island,#blitz-portrait .bp-home {position:absolute;left:50%;translate:-50% 0;background:#000;z-index:5;border-radius:99px}
#blitz-portrait .bp-island {border-radius:2px}
#blitz-portrait .bp-island {width:29%;height:3%;top:1.55%}
#blitz-portrait .bp-home {width:31%;height:.5%;bottom:1%;background:#fff9}
#blitz-portrait .bp-screen {position:absolute;inset:0;display:flex;flex-direction:column;padding:16cqw 4cqw 11cqw;gap:3.5cqw;background:radial-gradient(ellipse 87% 36% at 50% 70%,#ffce25,#c33c23 49%,transparent 100%),linear-gradient(#100e27 0%,#3f2475 28%,#6f214f 60%,#0c090e 94%);font-size:4.25cqw;isolation:isolate}
#blitz-portrait .bp-screen::before {content:"";position:absolute;inset:auto 0 0;height:32%;background:#100b14;opacity:.92;z-index:-1;clip-path:polygon(0 22%,9% 28%,9% 13%,16% 21%,16% 48%,24% 42%,24% 62%,31% 59%,31% 73%,40% 70%,40% 81%,54% 80%,54% 74%,66% 74%,66% 61%,75% 65%,75% 47%,82% 44%,82% 28%,88% 30%,88% 9%,95% 12%,95% 20%,100% 21%,100% 100%,0 100%)}
#blitz-portrait .bp-screen.teal {background:radial-gradient(ellipse at 50% 72%,#069e9d,#09515a 38%,#061c24 72%,#070f16)}
#blitz-portrait .bp-screen.playfield {background:linear-gradient(#0d0d24,#24214a 35%,#0c0c1c 81%);gap:2cqw}
#blitz-portrait .bp-screen.playfield::before {display:none}
#blitz-portrait .bp-screen h3,#blitz-portrait .bp-screen p {margin:0}
#blitz-portrait .bp-screen h3 {font-size:6cqw;text-align:center}
#blitz-portrait .bp-screen small {font-size:3.65cqw}
#blitz-portrait .bp-screen button {font:inherit;font-weight:700;color:inherit;background:#100d1caa;border:1px solid #ffffff30;min-height:11cqw;padding:1cqw 2cqw}
#blitz-portrait .bp-screen button.hot,#blitz-portrait .bp-screen .hot {background:#ffda16;color:#171006}
#blitz-portrait .bp-head {text-align:center;padding:2.6cqw 0;font-weight:bold;font-size:5.5cqw;background:#100c1ed0;border-block:2px solid #ff362c;box-shadow:0 0 8px #ff352e70}
#blitz-portrait .bp-head.bulbs {border-block:3px dotted #ffdd99;box-shadow:none}
#blitz-portrait .bp-tabs {display:grid;grid-template-columns:repeat(3,1fr);background:#130e1b;border-block:2px solid var(--bp-neon);box-shadow:0 0 7px var(--bp-neon)}
#blitz-portrait .bp-tabs button {font-size:3.45cqw;color:#e3d7e7;border:0}
#blitz-portrait .bp-tabs button[aria-current] {color:white;background:#ffffff20;box-shadow:inset 0 -2px var(--bp-neon)}
#blitz-portrait .bp-row {display:flex;align-items:stretch;gap:2cqw}
#blitz-portrait .bp-row>* {flex:1;min-width:0}
#blitz-portrait .bp-list {display:grid;gap:1.2cqw}
#blitz-portrait .bp-list.left button {text-align:left;padding-inline:3cqw}
#blitz-portrait .bp-list button.song {display:flex;align-items:center;justify-content:space-between;gap:1cqw}
#blitz-portrait .bp-list button.song span:first-child {overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#blitz-portrait .bp-list button.song span:last-child {white-space:nowrap;font-size:3.3cqw}
#blitz-portrait .bp-group {background:#0d0b18cc;padding:1.6cqw 3cqw;font-size:3.4cqw;font-weight:800}
#blitz-portrait .bp-bottom {margin-top:auto}
#blitz-portrait .bp-panel {border:2px solid #5ccaff;box-shadow:0 0 9px #2387fa;background:#130e22e8;padding:4cqw;display:grid;gap:3cqw}
#blitz-portrait .bp-panel strong {color:#ffda16}
#blitz-portrait .bp-card {display:flex;gap:3cqw;align-items:center;background:#160d22ee;border:1px solid #fc4b3b;padding:2cqw}
#blitz-portrait .bp-album {flex:none;width:18cqw;aspect-ratio:1;background-image:var(--bp-cover);background-size:1024% auto;background-position:71.6% 33.3%}
#blitz-portrait .bp-logo {width:88cqw;aspect-ratio:560/426;align-self:center;background-image:var(--bp-title);background-size:274.29% auto;background-position:50% 10%;mask-image:radial-gradient(ellipse 72% 75%,black 60%,transparent 100%)}
#blitz-portrait .bp-title {padding-top:29cqw}
#blitz-portrait .bp-title .bp-start {margin-top:39cqw;align-self:center;width:65cqw}
#blitz-portrait .bp-main .bp-logo {width:70cqw}
#blitz-portrait .bp-main .bp-list {margin:0 8cqw}
#blitz-portrait .bp-mini {display:grid;grid-template-columns:1fr repeat(3,11cqw);gap:1cqw;align-items:center;padding:2cqw;background:#100c1ef0}
#blitz-portrait .bp-mini small {display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#blitz-portrait .bp-center {text-align:center}
#blitz-portrait .bp-options {margin-top:9cqw}
#blitz-portrait .bp-detail {padding:3cqw;background:#0b343dcf}
#blitz-portrait .bp-grid {display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;text-align:center}
#blitz-portrait .bp-grid button {display:grid;justify-items:center;align-content:center;gap:2cqw;font-size:3.3cqw}
#blitz-portrait .bp-disc {display:grid;place-items:center;width:15cqw;aspect-ratio:1;border-radius:50%;border:2px solid #eee;background:linear-gradient(#aaa,#272731 60%);margin:0 auto 1cqw;font-size:6cqw;font-weight:900;color:white}
#blitz-portrait .bp-powericons button {padding:0;border:0;background:transparent;font-size:5cqw;min-width:0}
#blitz-portrait .bp-powericons .bp-disc {width:11cqw;margin:0 auto;font-size:4cqw}
#blitz-portrait .bp-tip {margin:14cqw 3cqw;text-align:center;line-height:1.4}
#blitz-portrait .bp-hud {display:grid;grid-template-columns:1fr 1fr 11cqw;align-items:center;gap:2cqw}
#blitz-portrait .bp-meter {text-align:center}
#blitz-portrait .bp-meter i {display:block;height:1.6cqw;border-radius:5px;background:linear-gradient(90deg,#78d2fd 37%,#ffffff22 37%)}
#blitz-portrait .bp-road {position:relative;flex:1;min-height:0}
#blitz-portrait .bp-road svg {width:100%;height:100%;display:block}
#blitz-portrait .bp-lanes {display:grid;grid-template-columns:repeat(5,1fr);gap:1cqw;text-align:center}
#blitz-portrait .bp-lanes span {padding:1cqw 0;background:#0d0c16;border-top:2px solid var(--lane);font-size:3.4cqw}
#blitz-portrait .bp-lanes .active {background:#154228}
#blitz-portrait .bp-controls {display:grid;grid-template-columns:repeat(6,1fr);gap:2cqw}
#blitz-portrait .bp-controls button {grid-column:span 2;background:#24223b;min-height:12cqw;font-size:3.5cqw}
#blitz-portrait .bp-controls .bp-hit {grid-column:span 3;min-height:17cqw;background:#31304b;font-size:4.4cqw}
#blitz-portrait .bp-controls .bp-hit:active {background:#c8f0ff;color:#151b2c}
#blitz-portrait .bp-pause {position:absolute;inset:0;display:grid;align-items:center;padding:5cqw;background:#030411a0;z-index:2}
#blitz-portrait .bp-pause .bp-panel {border:3px double #77e3ff}
</style>
<script>
(() => {
  const root = document.getElementById('blitz-portrait');
  const screen = root.querySelector('.bp-screen');
  const picker = root.querySelector('select');
  const output = root.querySelector('output');
  const prev = root.querySelector('[data-step="-1"]');
  const next = root.querySelector('[data-step="1"]');
  const names = ['Title', 'Main menu', 'Help & Options', 'Messages', 'Rhythmverse', 'Your Songs', 'Select Power-Ups', 'Ready to begin', 'Gameplay', 'Paused'];
  const button = (name, cls = '', to = '') => '<button type="button" class="' + cls + '"' + (to === '' ? '' : ' data-go="' + to + '"') + '>' + name + '</button>';
  const row = (...items) => '<div class="bp-row">' + items.join('') + '</div>';
  const list = (items, cls = '') => '<div class="bp-list ' + cls + '">' + items.join('') + '</div>';
  const head = (name, cls = '') => '<div class="bp-head ' + cls + '">' + name + '</div>';
  const bottom = (...items) => '<div class="bp-bottom">' + row(...items) + '</div>';
  const logo = '<div class="bp-logo" role="img" aria-label="Rock Band Blitz Ultimate"></div>';
  const tabs = current => '<nav class="bp-tabs" style="--bp-neon:' + ['#55b8ff','#ffaf45','#ff4035'][current] + '" aria-label="Song hub">' + ['Messages','Rhythmverse','Your Songs'].map((item,i) => '<button type="button" data-go="' + (i+3) + '"' + (i === current ? ' aria-current="page"' : '') + '>' + item + '</button>').join('') + '</nav>';
  const album = '<div class="bp-album" role="img" aria-label="Stunt album cover"></div>';
  const card = detail => '<div class="bp-card">' + album + '<div><b>One Week</b><br><small>Barenaked Ladies · Stunt<br>' + detail + '</small></div></div>';
  const disc = text => '<span class="bp-disc">' + text + '</span>';
  const song = (name, active) => button('<span>' + name + '</span><span>★★★★★</span>', 'song' + (active ? ' hot' : ''));
  const colors = ['#40ec79','#ff5b64','#ffd350','#54c3ff','#ff9c40'];
  const laneNames = ['Drums','Bass','Guitar','Keys','Vocals'];
  let activeLane = 0;
  function road() {
    const at = (i,y) => 184 + ((i - 2.5) * 163 / 2.5) * (.25 + .75 * (y-25)/330);
    const lanes = colors.map((color,i) => {
      const shape = 'M ' + at(i,25) + ' 25 L ' + at(i+1,25) + ' 25 L ' + at(i+1,355) + ' 355 L ' + at(i,355) + ' 355 Z';
      const notes = [90,140,200,254,305].filter((_,n) => (i+n)%3 !== 0).map((y,n) => {
        const x = at(i + (n%2 ? .25 : .75),y);
        return '<rect x="' + (x-6) + '" y="' + (y+i*5-10) + '" width="12" height="5" rx="2" fill="' + color + '" stroke="#fff" stroke-width="1"/>';
      }).join('');
      return '<path d="' + shape + '" fill="' + (i === activeLane ? '#123822' : '#0c0c16') + '" stroke="' + color + '" stroke-width="' + (i === activeLane ? 2.6 : 1.15) + '"/><path d="M ' + at(i+.5,25) + ' 25 L ' + at(i+.5,355) + ' 355" stroke="' + color + '" opacity=".27"/>' + notes;
    }).join('');
    return '<div class="bp-road"><svg viewBox="0 0 368 370" preserveAspectRatio="none" role="img" aria-label="Five instrument tracks with a shared hit line"><path d="M 0 130 L 0 60 28 45 28 113 49 110 49 79 73 85 73 117 99 109 99 83 120 77 120 117 140 104 140 83 162 73 162 124 202 123 202 67 227 75 227 104 258 100 258 64 281 56 281 110 308 116 308 48 338 58 338 93 368 104 368 360 0 360 Z" fill="#181630" stroke="#413768" stroke-width="2"/>' + lanes + '<path d="M ' + at(0,345) + ' 345 H ' + at(5,345) + '" stroke="#ffffff45" stroke-width="2"/><path d="M ' + at(activeLane,345) + ' 345 H ' + at(activeLane+1,345) + '" stroke="#fff0ac" stroke-width="5"/></svg></div>';
  }
  const hud = () => '<div class="bp-hud"><b>0<br><small>☆ &nbsp;0:04 / 2:52</small></b><div class="bp-meter"><small>BLITZ</small><i></i></div>' + button('Ⅱ', '', 9).replace('class=""','class="" aria-label="Pause"') + '</div>';
  const controls = () => '<div class="bp-lanes">' + laneNames.map((name,i) => '<span style="--lane:' + colors[i] + '" class="' + (i === activeLane ? 'active' : '') + '">' + name + '<br>1×</span>').join('') + '</div><div class="bp-controls"><button type="button" data-lane="-1">‹ Track</button><button type="button" aria-label="Overdrive, charging">Overdrive</button><button type="button" data-lane="1">Track ›</button>' + button('Left note','bp-hit') + button('Right note','bp-hit') + '</div>';
  const pause = () => '<div class="bp-pause"><div class="bp-panel"><h3>GAME PAUSED</h3>' + list([button('Resume Game','hot',8), button('Help &amp; Options','',2),button('Achievements'),button('Restart'),button('Quit Song'),button('Main Menu','',1),button('Exit Game')]) + '</div></div>';
  const scenes = [
    () => logo + button('TAP TO START','hot bp-start',1),
    () => logo + list([button('PLAY','hot',5),button('PLAY CURRENT SONG','',6),button('RHYTHMVERSE','',4),button('HELP &amp; OPTIONS','',2),button('EXIT GAME')]) + '<div class="bp-mini bp-bottom"><small>Death on Two Legs…<br>Queen</small>' + button('‹‹') + button('Ⅱ') + button('››') + '</div>',
    () => head('HELP &amp; OPTIONS','bulbs') + list(['Controls','Calibration','General','Audio/Video','Gameplay','How to Play'].map((name,i) => button(name,i === 0 ? 'hot' : '')), 'bp-options') + '<div class="bp-detail"><small>Choose the devices and the controller mappings that play the game.</small></div>' + bottom(button('‹ Back','',1)),
    () => tabs(0) + list([button('2026-11-06 Welcome','hot')], 'left') + '<article class="bp-panel"><strong>Welcome to version 0.1.0 :)</strong><p>This is the very first version of the Rock Band Blitz project. Play as much as you can, enjoy, and let me know about any bugs on GitHub!</p></article>' + bottom(button('‹ Back','',1)),
    () => tabs(1) + list([button('Recently Added','hot'),button('Search')], 'left') + '<div class="bp-panel bp-center" style="margin:6cqw 13cqw;border-color:#f8a43e;box-shadow:0 0 8px #b95d1b"><b>ROCK BAND<br>BLITZ</b></div>' + bottom(button('‹ Back','',1),button('Filters')),
    () => tabs(2) + row(button('Sort · Artist'),button('Search')) + list([button('Random Song'),'<span class="bp-group">BARENAKED LADIES</span>',song('One Week',true),'<span class="bp-group">FOO FIGHTERS</span>',song('These Days',false),'<span class="bp-group">QUEEN</span>',song('Death on Two Legs (Dedicated to…)',false)],'left') + '<div class="bp-bottom">' + card('Rock · 1998 &nbsp; ●●●●○') + row(button('‹ Back','',1),button('Shortcuts'),button('Select','hot',6)) + '</div>',
    () => head('SELECT POWER-UPS') + card('Track difficulty &nbsp; ●●●○○') + '<div class="bp-grid">' + button(disc('') + 'Overdrive','hot') + button(disc('') + 'Note') + button(disc('') + 'Track') + '</div><div class="bp-panel"><div class="bp-row bp-powericons">' + ['','2×','◉','◎','✦','›'].map(icon => button(disc(icon))).join('') + '</div><strong>NO POWER-UP SELECTED</strong><small>Hit glowing white notes to build energy, then tap Overdrive to deploy.</small></div>' + bottom(button('‹ Back','',5),button('Play Song','hot',7)),
    () => '<p class="bp-tip">The Recommended screen shows both songs you own and songs you SHOULD own.</p><div class="bp-grid"><div>' + disc('2×') + '<small>Point Doubler</small></div><div>' + disc('') + '<small>No Power-up<br>selected</small></div><div>' + disc('') + '<small>No Power-up<br>selected</small></div></div>' + bottom(button('Begin','hot',8)),
    () => hud() + road() + controls(),
    () => hud() + road() + controls() + pause()
  ];
  picker.innerHTML = names.map((name,i) => '<option value="' + i + '">' + String(i+1).padStart(2,'0') + ' · ' + name + '</option>').join('');
  function show(index) {
    picker.value = index;
    screen.className = 'bp-screen ' + (['bp-title','bp-main','teal','','','','','teal','playfield','playfield'][index]);
    screen.innerHTML = scenes[index]();
    prev.disabled = index === 0;
    next.disabled = index === names.length - 1;
    output.textContent = (index+1) + ' / ' + names.length;
  }
  picker.addEventListener('change', () => show(Number(picker.value)));
  root.querySelectorAll('[data-step]').forEach(control => control.addEventListener('click', () => show(Number(picker.value) + Number(control.dataset.step))));
  screen.addEventListener('click', event => {
    const go = event.target.closest('[data-go]');
    const lane = event.target.closest('[data-lane]');
    if (go) show(Number(go.dataset.go));
    if (lane && picker.value === '8') {
      activeLane = Math.max(0, Math.min(4, activeLane + Number(lane.dataset.lane)));
      show(8);
    }
  });
  show(0);
})();
